services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook_relay
      POSTGRES_PASSWORD: webhook_relay
      POSTGRES_DB: webhook_relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook_relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./api
      target: migrator
    environment:
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    profiles: ["tools"]
    build:
      context: ./api
      target: seeder
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
      DEMO_API_KEY: ${DEMO_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./api
      target: runner
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./api
      target: runner
    command: node dist/queue/deliveryWorker.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
