services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook_relay
      POSTGRES_PASSWORD: webhook_relay
      POSTGRES_DB: webhook_relay
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook_relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./api
      target: migrator
    environment:
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    profiles: ["tools"]
    build:
      context: ./api
      target: seeder
    environment:
      NODE_ENV: development
      SIGNING_SECRET_KEY: ${SIGNING_SECRET_KEY:-}
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
      DEMO_API_KEY: ${DEMO_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    build:
      context: ./api
      target: runner
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      SIGNING_SECRET_KEY: ${SIGNING_SECRET_KEY:-}
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    build:
      context: ./api
      target: runner
    command: node dist/queue/deliveryWorker.js
    environment:
      NODE_ENV: development
      SIGNING_SECRET_KEY: ${SIGNING_SECRET_KEY:-}
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@postgres:5432/webhook_relay
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/deliveries"]
      interval: 5s
      timeout: 3s
      retries: 12
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
