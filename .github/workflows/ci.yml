name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhook_relay
          POSTGRES_PASSWORD: webhook_relay
          POSTGRES_DB: webhook_relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook_relay -d webhook_relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://webhook_relay:webhook_relay@localhost:5432/webhook_relay_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npm run prisma:generate

      - name: Validate Prisma schema
        working-directory: api
        run: npx prisma validate

      - name: Apply migrations to fresh database
        working-directory: api
        run: npm run prisma:deploy

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build
