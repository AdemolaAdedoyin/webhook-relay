# Private, single-host production-mode template. Put a TLS reverse proxy in front.
name: webhook-relay-production
x-environment: &environment
  NODE_ENV: production
  DATABASE_URL: postgresql://webhook_relay:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/webhook_relay
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
  SIGNING_SECRET_KEY: ${SIGNING_SECRET_KEY:?Set SIGNING_SECRET_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:?Set WEBHOOK_ALLOWED_HOSTS}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
  DELIVERY_MAX_REPLAYS: ${DELIVERY_MAX_REPLAYS:-5}
  LOG_LEVEL: info
x-runtime: &runtime
  build: { context: ./api, target: runner }
  environment: *environment
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook_relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: webhook_relay
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U webhook_relay -d webhook_relay]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ./api, target: migrator }
    environment: *environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  bootstrap:
    <<: *runtime
    profiles: [tools]
    command: [node, dist/scripts/create-tenant.js]
    restart: "no"
    environment:
      <<: *environment
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
  api:
    <<: *runtime
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *runtime
    command: [node, dist/queue/deliveryWorker.js]
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
    ports: ["127.0.0.1:${WEB_PORT:-5173}:8080"]
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/deliveries']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
volumes:
  pgdata:
  redisdata:
